plugins {
    id 'java'
}

group = 'com.commandrunner'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.6'
}

jar {
    manifest {
        attributes 'Extension-Class': 'CommandRunnerMontoya'
    }
}
